apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vault
spec:
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/omchakravarti05/vault-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: VAULT_API_URL
              value: http://backend:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 20
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }