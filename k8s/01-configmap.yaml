apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  POSTGRES_USER: vault_user
  POSTGRES_DB: vault_db
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  MAX_UPLOAD_MB: "20"
  LLM_PROVIDER: ollama
  GROQ_MODEL: openai/gpt-oss-20b
  STORAGE_DIR: /data/storage
  OLLAMA_BASE_URL: http://host.minikube.internal:11434